name: Hizli Sinyal Botu

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo dosyalarını çek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Kütüphaneleri Yükle
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Hızlı Taramayı Başlat
      run: |
        python main.py
